[project]
name = "setswana"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "S",    # flake8-bandit (security)
    "DJ",   # flake8-django
    "LOG",  # flake8-logging
    "T20",  # flake8-print
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]
ignore = [
    "RUF001", # emoji/ambiguous unicode allowed in strings (log prefixes)
]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["S101"]
"**/tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "single"
