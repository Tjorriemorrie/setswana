# Survival vocabulary from Peace Corps Botswana, "An Introduction to the Setswana Language"
# (data/raw/peace_corps/bw_setswana_language_lessons.pdf), in lesson order. These words are ranked
# first, in the order listed here (see `import_peace_corps` and `build_ranking`).
#
# Spelling follows the PDF (ê/ô included; answers are accepted without them). The PDF's English
# column is often shifted one row against the Setswana, so pairs were realigned by meaning.
# Particles (le, ke, a, go, ...) are left out: they belong to the later sentence phase.
#
# pos: n, v, a (adjective, also numbers), r (adverb), pron, conj, interj, phrase (a fixed expression).
# Parts of speech follow the existing lexemes where they differ (nngwe is a noun in Brown).
# Optional `plural` is stored on the lexeme. Questions are listed without the question mark.

