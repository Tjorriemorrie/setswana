      - {setswana: borra, pos: n, english: "gentlemen; sirs"}
      - {setswana: bomma, pos: n, english: "ladies; madams"}
      - {setswana: o tsogile jang, pos: phrase, english: "how are you? (formal, lit. how did you rise?)"}
      - {setswana: ke tsogile sentle, pos: phrase, english: "I am fine (lit. I rose well)"}
      - {setswana: sentle, pos: a, english: "well; nicely"}
      - {setswana: le kae, pos: phrase, english: "how are you? (informal)"}
      - {setswana: re teng, pos: phrase, english: "we are fine (informal reply)"}
      - {setswana: re a leboga, pos: phrase, english: "thank you (lit. we thank)"}

